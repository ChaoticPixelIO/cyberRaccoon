<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberRaccoon</title>
    <link rel="stylesheet" href="/static/style.css?v=12">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="/static/app.js?v=15"></script>
</head>
<body>

<div id="app" x-data="cyberRaccoon()" x-init="init()">

    <!-- Header -->
    <header class="header">
        <h1>CyberRaccoon</h1>
        <span class="status-badge" :class="modulesReady ? 'ready' : 'offline'"
              x-text="modulesReady ? 'Ready' : 'Offline'"></span>
    </header>

    <!-- Navigation tabs -->
    <nav class="tabs">
        <button :class="{ active: tab === 'task' }"    @click="tab = 'task'">Task</button>
        <button :class="{ active: tab === 'config' }"  @click="tab = 'config'">Config</button>
        <button :class="{ active: tab === 'skills' }"  @click="tab = 'skills'; loadSkills()">Skills</button>
        <button :class="{ active: tab === 'status' }"  @click="tab = 'status'">Status</button>
        <button :class="{ active: tab === 'debug' }"   @click="tab = 'debug'">Debug</button>
    </nav>

    <!-- ============================================================ -->
    <!-- Task Panel                                                    -->
    <!-- ============================================================ -->
    <section x-show="tab === 'task'" class="panel">

        <!-- Connection panel — two independent rows -->
        <div class="connection-panel">
            <!-- Capture row -->
            <div class="connection-row">
                <div class="connection-item">
                    <span class="connection-label-fixed">Screen Capture:</span>
                    <select class="connection-select" x-model="config.capture_source"
                            @change="saveTopLevel()"
                            :disabled="captureReady || connectingCapture">
                        <option value="uvc">UVC (USB capture card)</option>
                        <option value="csi">CSI (HDMI-to-CSI bridge)</option>
                        <option value="airplay">AirPlay</option>
                    </select>
                    <span class="tooltip-wrap">
                        <span class="tooltip-icon">?</span>
                        <span class="tooltip-text" x-text="captureTooltip()"></span>
                    </span>
                </div>
                <div class="connection-actions">
                    <span class="status-dot" :class="captureReady ? 'dot-ok' : (captureError ? 'dot-error' : 'dot-off')"></span>
                    <span class="device-name" x-show="captureDevice" x-text="captureDevice" x-cloak></span>
                    <template x-if="!captureReady && !connectingCapture">
                        <button @click="connectCapture()" class="btn btn-primary btn-sm">Connect</button>
                    </template>
                    <template x-if="connectingCapture">
                        <div style="display:flex;gap:0.25rem;">
                            <button disabled class="btn btn-primary btn-sm">
                                <span class="spinner"></span> Connecting…
                            </button>
                            <button @click="cancelConnectCapture()" class="btn btn-sm btn-danger">Cancel</button>
                        </div>
                    </template>
                    <template x-if="captureReady && !connectingCapture">
                        <button @click="disconnectCapture()" :disabled="taskRunning"
                                class="btn btn-sm btn-connected">Disconnect</button>
                    </template>
                </div>
            </div>
            <!-- Input row -->
            <div class="connection-row">
                <div class="connection-item">
                    <span class="connection-label-fixed">Mouse/Keyboard:</span>
                    <select class="connection-select" x-model="config.executor_transport"
                            @change="saveTopLevel()"
                            :disabled="executorReady || connectingExecutor">
                        <option value="usb">USB HID</option>
                        <option value="bt">Bluetooth</option>
                    </select>
                    <span class="tooltip-wrap">
                        <span class="tooltip-icon">?</span>
                        <span class="tooltip-text" x-text="transportTooltip()"></span>
                    </span>
                </div>
                <div class="connection-actions">
                    <span class="status-dot" :class="executorReady ? 'dot-ok' : (executorError ? 'dot-error' : 'dot-off')"></span>
                    <span class="device-name" x-show="executorDevice" x-text="executorDevice" x-cloak></span>
                    <template x-if="!executorReady && !connectingExecutor">
                        <button @click="connectExecutor()" class="btn btn-primary btn-sm">Connect</button>
                    </template>
                    <template x-if="connectingExecutor">
                        <div style="display:flex;gap:0.25rem;">
                            <button disabled class="btn btn-primary btn-sm">
                                <span class="spinner"></span> Connecting…
                            </button>
                            <button @click="cancelConnectExecutor()" class="btn btn-sm btn-danger">Cancel</button>
                        </div>
                    </template>
                    <template x-if="executorReady && !connectingExecutor">
                        <button @click="disconnectExecutor()" :disabled="taskRunning"
                                class="btn btn-sm btn-connected">Disconnect</button>
                    </template>
                </div>
            </div>
            <!-- Target OS row -->
            <div class="connection-row">
                <div class="connection-item">
                    <span class="connection-label-fixed">Target OS:</span>
                    <select class="connection-select" x-model="config.target_os"
                            @change="saveTopLevel()">
                        <option value="">Auto-detect</option>
                        <option value="windows">Windows</option>
                        <option value="macos">macOS</option>
                        <option value="linux">Linux</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="connection-error" x-show="captureError" x-text="captureError" x-cloak></div>
        <div class="connection-error" x-show="executorError" x-text="executorError" x-cloak></div>

        <div class="task-controls">
            <input type="text" x-model="taskGoal" placeholder="Task goal..."
                   @keydown.enter="if (!$event.isComposing) startTask()"
                   :disabled="taskRunning" class="task-input">
            <button @click="startTask()"
                    :disabled="taskRunning || connectingCapture || connectingExecutor || !taskGoal.trim()"
                    class="btn btn-primary">
                <template x-if="!connectingCapture && !connectingExecutor">
                    <span>Start</span>
                </template>
                <template x-if="connectingCapture || connectingExecutor">
                    <span><span class="spinner"></span> Connecting…</span>
                </template>
            </button>
            <button @click="abortTask()" :disabled="!taskRunning"
                    x-show="taskRunning && !planExecuting && !planPaused"
                    class="btn btn-danger">Abort</button>
            <button x-show="planExecuting && !pauseRequested"
                    @click="pauseTask()"
                    class="btn btn-pause">Pause</button>
            <button x-show="planExecuting && pauseRequested"
                    class="btn btn-pause" disabled>
                <span class="spinner-sm"></span> Pausing…</button>
            <button x-show="planPaused"
                    @click="resumeTask()"
                    class="btn btn-resume"
                    :disabled="planPreview !== null || editingStep !== null">Resume</button>
            <button x-show="planPaused"
                    @click="cancelPausedTask()"
                    class="btn btn-danger">Cancel</button>
            <button @click="resetTask()"
                    x-show="!taskRunning"
                    class="btn btn-sm"
                    title="Force-clear stale task state"
                    style="opacity: 0.6;">Reset</button>
        </div>


        <!-- Task stats (live running total, not just at task end) -->
        <template x-if="totalInputTokens > 0 || totalOutputTokens > 0">
            <div class="task-stats">
                <template x-if="taskResult">
                    <span>
                        <span x-text="taskResult.total_steps + ' steps'"></span>
                        <span>·</span>
                        <span x-text="taskResult.total_duration_s + 's'"></span>
                        <span>·</span>
                    </span>
                </template>
                <span x-text="totalInputTokens.toLocaleString() + ' in'"></span>
                <span>·</span>
                <span x-text="totalOutputTokens.toLocaleString() + ' out'"></span>
                <template x-if="totalCacheReadTokens > 0 || totalCacheCreationTokens > 0">
                    <span>
                        <span>·</span>
                        <span x-text="totalCacheReadTokens.toLocaleString() + ' cache read'"></span>
                        <span>·</span>
                        <span x-text="totalCacheCreationTokens.toLocaleString() + ' cache write'"></span>
                    </span>
                </template>
            </div>
        </template>

        <!-- Escalation banner -->
        <template x-if="escalationPending">
            <div class="escalation-banner">
                <div class="escalation-header">Action Required</div>
                <p class="escalation-reason" x-text="escalationReason"></p>
                <p class="muted">Resolve the issue on the target machine, then click Resume.</p>
                <button class="btn btn-sm btn-start" @click="resolveEscalation()">Resume</button>
            </div>
        </template>

        <!-- ---- Split layout: step inspection area (D-09) ---- -->
        <div class="step-split" x-ref="splitContainer">

            <!-- Left column: screenshot + prompt/response tabs -->
            <div class="step-split-left">

                <!-- Screenshot preview (inside split) -->
                <div class="preview-area">
                    <template x-if="captureReady">
                        <button class="btn-refresh-screenshot"
                                @click="refreshScreenshot()"
                                :disabled="refreshingScreenshot"
                                title="Capture current screen">
                            <span x-show="!refreshingScreenshot">&#x21BB;</span>
                            <span x-show="refreshingScreenshot" class="spinner-sm"></span>
                        </button>
                    </template>
                    <template x-if="screenshot">
                        <img :src="'data:image/jpeg;base64,' + screenshot"
                             alt="Screen preview" class="preview-img">
                    </template>
                    <template x-if="!screenshot">
                        <div class="preview-placeholder">No screenshot yet</div>
                    </template>
                </div>

                <!-- Tab bar: Prompt | Response tabs + Formatted/Raw toggle -->
                <div class="step-detail-tab-bar">
                    <div class="step-detail-tabs">
                        <button :class="{ active: stepDetailTab === 'prompt' }"
                                @click="switchStepDetailTab('prompt')">Prompt</button>
                        <button :class="{ active: stepDetailTab === 'response' }"
                                @click="switchStepDetailTab('response')">Response</button>
                    </div>
                    <div class="view-mode-toggle" role="tablist" aria-label="View mode">
                        <button type="button" class="plan-mode-pill"
                                :class="{ 'plan-mode-pill-active': viewMode === 'formatted' }"
                                @click="viewMode = 'formatted'"
                                role="tab" :aria-selected="viewMode === 'formatted'">Formatted</button>
                        <button type="button" class="plan-mode-pill"
                                :class="{ 'plan-mode-pill-active': viewMode === 'raw' }"
                                @click="viewMode = 'raw'"
                                role="tab" :aria-selected="viewMode === 'raw'">Raw</button>
                    </div>
                </div>

                <!-- Prompt tab content -->
                <div x-show="stepDetailTab === 'prompt'" class="step-detail-content" x-ref="promptContent">
                    <template x-if="activeStep">
                        <div>
                            <div style="text-align: right; margin-bottom: 0.25rem;">
                                <button class="btn-copy" style="position: static;"
                                        @click="copyText((activeStep.system_prompt || '') + '\n\n' + formatRawPrompt(activeStep), $event)">Copy</button>
                            </div>
                            <div x-html="renderStepContent(activeStep, 'prompt', viewMode)"></div>
                        </div>
                    </template>
                    <template x-if="!activeStep">
                        <p class="muted" style="padding: 1rem;">Select a step from the log to inspect its prompt and response.</p>
                    </template>
                </div>

                <!-- Response tab content -->
                <div x-show="stepDetailTab === 'response'" class="step-detail-content" x-ref="responseContent">
                    <template x-if="activeStep">
                        <div>
                            <div style="text-align: right; margin-bottom: 0.25rem;">
                                <button class="btn-copy" style="position: static;"
                                        @click="copyText(activeStep.llm_response_text || '', $event)">Copy</button>
                            </div>
                            <div x-html="renderStepContent(activeStep, 'response', viewMode)"></div>
                        </div>
                    </template>
                    <template x-if="!activeStep">
                        <p class="muted" style="padding: 1rem;">Select a step from the log to inspect its prompt and response.</p>
                    </template>
                </div>

            </div><!-- .step-split-left -->

            <!-- Divider -->
            <div class="step-split-divider" x-ref="splitDivider"></div>

            <!-- Right column: plan checklist + follow indicator + step log -->
            <div class="step-split-right">

                <!-- Workflow plan checklist (moved into right column) -->
                <template x-if="workflowPlan">
                    <div class="workflow-plan" :class="{ 'plan-pending': planPending, 'plan-paused': planPaused }">
                        <div class="workflow-plan-header">
                            <span x-text="planPending ? 'Review Plan' : planPaused ? 'Paused' : planExecuting ? 'Executing Plan' : 'Plan'"></span>
                            <template x-if="planPaused">
                                <span class="paused-badge">PAUSED</span>
                            </template>
                            <template x-if="planPending">
                                <span class="plan-actions">
                                    <button class="btn btn-sm btn-start"
                                            @click="approvePlan()"
                                            :disabled="planPreview !== null || editingStep !== null"
                                            :title="planPreview !== null ? 'Accept or discard the proposed changes first.' : (editingStep !== null ? 'Finish editing the step first.' : '')">Execute</button>
                                    <button class="btn btn-sm btn-abort" @click="rejectPlan()">Cancel</button>
                                </span>
                            </template>
                        </div>
                        <template x-if="planPreview">
                            <div class="plan-preview-banner">
                                <div class="plan-preview-header">Proposed Changes</div>
                                <div class="plan-preview-summary">Summary: <span x-text="planPreview.summary"></span></div>
                                <div class="plan-preview-instruction">Review the highlighted changes and accept or discard.</div>
                                <div class="plan-preview-actions">
                                    <button type="button" class="btn btn-sm btn-primary" @click="acceptPlanRewrite()">Accept Changes</button>
                                    <button type="button" class="btn btn-sm btn-discard" @click="discardPlanRewrite()">Discard</button>
                                </div>
                            </div>
                        </template>
                        <template x-for="diffEntry in computedDiff" :key="diffEntry.key">
                            <div>
                                <div class="workflow-step"
                                     :class="['ws-' + (diffEntry.status || 'pending'),
                                              diffEntry.diffState ? 'ws-diff-' + diffEntry.diffState : '',
                                              selectedWorkflowStep === diffEntry.number ? 'ws-selected' : '',
                                              planPaused && diffEntry.status === 'done' ? 'ws-step-completed-lock' : '']"
                                     @click="planPaused && diffEntry.status === 'done' ? null : selectWorkflowStep(diffEntry.number)"
                                     style="cursor: pointer;">
                                    <span class="ws-check"
                                          x-text="diffEntry.status === 'done' ? '✓' : diffEntry.status === 'running' ? '▶' : diffEntry.status === 'rebooting' ? '⟳' : diffEntry.status === 'escalated' ? '!' : '○'"></span>
                                    <span class="ws-num" x-text="diffEntry.number + '.'"></span>

                                    <!-- Manually-edited marker (persists outside preview) -->
                                    <template x-if="diffEntry.edited && !diffEntry.diffState">
                                        <span class="ws-pill ws-pill-edited">&#x270E; edited</span>
                                    </template>

                                    <!-- Phase 7: Paused step pill -->
                                    <template x-if="diffEntry.status === 'partial'">
                                        <span class="ws-pill ws-pill-partial">PAUSED</span>
                                    </template>

                                    <!-- Diff pills (preview state only) -->
                                    <template x-if="diffEntry.diffState === 'added'">
                                        <span class="ws-pill ws-pill-added">+ NEW</span>
                                    </template>
                                    <template x-if="diffEntry.diffState === 'removed'">
                                        <span class="ws-pill ws-pill-removed">&mdash; REMOVED</span>
                                    </template>
                                    <template x-if="diffEntry.diffState === 'modified'">
                                        <span class="ws-pill ws-pill-modified">&#x270E; MODIFIED</span>
                                    </template>

                                    <!-- Goal text (click toggles step detail via parent div) -->
                                    <template x-if="editingStep !== diffEntry.number">
                                        <span class="ws-goal"
                                              :class="diffEntry.diffState === 'removed' ? 'ws-goal-strike' : ''"
                                              x-text="diffEntry.goal"></span>
                                    </template>
                                    <template x-if="editingStep === diffEntry.number">
                                        <textarea class="ws-goal-editor"
                                                  x-model="editingDraft"
                                                  x-ref="editingTextarea"
                                                  @click.stop
                                                  @keydown.enter.prevent="saveEditStep()"
                                                  @keydown.escape.prevent="cancelEditStep()"
                                                  @blur="saveEditStep()"
                                                  :aria-label="'Edit step ' + diffEntry.number + ' goal'"></textarea>
                                    </template>

                                    <!-- Phase 6: fraction badge after step completes -->
                                    <template x-if="diffEntry.actions_used !== undefined">
                                        <span class="ws-budget"
                                              :class="diffEntry.expected_actions != null && diffEntry.expected_actions > 0 && diffEntry.actions_used > diffEntry.expected_actions
                                                  ? 'ws-budget-over'
                                                  : diffEntry.expected_actions != null && diffEntry.expected_actions > 0
                                                      ? 'ws-budget-ok'
                                                      : ''"
                                              x-text="diffEntry.expected_actions != null && diffEntry.expected_actions > 0
                                                  ? diffEntry.actions_used + '/' + diffEntry.expected_actions + ' actions'
                                                  : diffEntry.actions_used + ' used'"
                                              :title="diffEntry.expected_actions != null && diffEntry.expected_actions > 0
                                                  ? 'Used ' + diffEntry.actions_used + ' of ' + diffEntry.expected_actions + ' estimated actions'
                                                  : 'Used ' + diffEntry.actions_used + ' actions (no estimate)'">
                                        </span>
                                    </template>
                                    <!-- Estimate badge before step completes -->
                                    <template x-if="diffEntry.actions_used === undefined && diffEntry.expected_actions !== null && diffEntry.expected_actions !== undefined">
                                        <span class="ws-budget"
                                              x-text="'~' + diffEntry.expected_actions"
                                              :title="'Estimated ' + diffEntry.expected_actions + ' actions for this step'">
                                        </span>
                                    </template>

                                    <!-- Edit pencil button (visible when step is editable) -->
                                    <template x-if="(planPending || planPaused) && !planPreview && editingStep === null && diffEntry.status !== 'done'">
                                        <button type="button"
                                                class="ws-edit-btn"
                                                @click.stop="beginEditStep(diffEntry)"
                                                title="Edit this step">&#x270E;</button>
                                    </template>
                                    <!-- Delete x button (hidden during preview or active inline edit) -->
                                    <template x-if="(planPending || planPaused) && !planPreview && editingStep === null">
                                        <button type="button"
                                                class="ws-delete-btn"
                                                @click.stop="deletePlanStep(diffEntry.number)"
                                                title="Delete this step">&times;</button>
                                    </template>
                                </div>

                                <!-- Modified step: stacked old goal text with inline text diff -->
                                <template x-if="diffEntry.diffState === 'modified' && Array.isArray(diffEntry.oldSegments)">
                                    <div class="ws-goal-old">
                                        <template x-for="(seg, si) in diffEntry.oldSegments" :key="si">
                                            <span :class="'ws-seg-' + seg.type" x-text="seg.text"></span>
                                        </template>
                                    </div>
                                </template>

                                <template x-if="diffEntry.expected_outcome">
                                    <div class="ws-outcome">Expected: <span x-text="diffEntry.expected_outcome"></span></div>
                                </template>

                                <template x-if="editingStep === diffEntry.number">
                                    <div class="ws-edit-hint">Enter to save &middot; Esc to cancel</div>
                                </template>
                            </div>
                        </template>

                        <!-- + Add step button (hidden during preview or inline edit) -->
                        <template x-if="(planPending || planPaused) && !planPreview && editingStep === null">
                            <button type="button" class="ws-add-step-btn" @click="addPlanStep()" title="Append a new empty step">+ Add step</button>
                        </template>

                        <!-- Delete confirmation banner (when plan would drop below 2 steps) -->
                        <template x-if="deleteConfirmStep !== null">
                            <div class="ws-delete-confirm">
                                <span x-text="deleteConfirmCopy"></span>
                                <div class="ws-delete-confirm-actions">
                                    <button type="button" class="btn btn-sm btn-danger" @click="confirmDeleteStep()">Delete Step</button>
                                    <button type="button" class="btn btn-sm" @click="deleteConfirmStep = null">Keep Step</button>
                                </div>
                            </div>
                        </template>
                        <!-- Plan discussion chat panel (Phase 4, DISCUSS-02) -->
                        <div class="plan-chat" x-show="planPending || planPaused">
                            <div class="plan-chat-header">Discuss Plan</div>

                            <div class="plan-chat-messages" x-ref="chatMessages">
                                <template x-if="chatHistory.length === 0 && !chatInFlight && !chatError">
                                    <div class="plan-chat-empty">
                                        <template x-if="planMode === 'ask'">
                                            <div>
                                                <div>Ask a question about this plan.</div>
                                                <div class="plan-chat-empty-hint">The agent will answer using the plan and the captured screen.</div>
                                            </div>
                                        </template>
                                        <template x-if="planMode === 'modify'">
                                            <div>
                                                <div>Describe how you want to change the plan.</div>
                                                <div class="plan-chat-empty-hint">For example: "use Win+R instead of clicking Start" or "merge steps 3 and 4".</div>
                                            </div>
                                        </template>
                                    </div>
                                </template>

                                <template x-for="(msg, idx) in chatHistory" :key="idx">
                                    <div class="plan-chat-msg" :class="'plan-chat-msg-' + msg.role">
                                        <span class="chat-role" x-text="msg.role === 'user' ? 'You' : 'Agent'"></span>
                                        <span class="chat-body" x-text="msg.text"></span>
                                    </div>
                                </template>

                                <template x-if="chatInFlight">
                                    <div class="plan-chat-msg plan-chat-msg-agent plan-chat-loading">
                                        <span class="chat-role">Agent</span>
                                        <span class="chat-body">Agent is thinking<span class="chat-dots"></span></span>
                                    </div>
                                </template>

                                <template x-if="chatError">
                                    <div class="plan-chat-error" x-text="chatError"></div>
                                </template>
                            </div>

                            <div class="plan-mode-toggle" role="tablist" aria-label="Chat mode">
                                <button type="button"
                                        class="plan-mode-pill"
                                        :class="{ 'plan-mode-pill-active': planMode === 'ask' }"
                                        @click="planMode = 'ask'"
                                        role="tab"
                                        :aria-selected="planMode === 'ask'"
                                        title="Ask a question about the plan">Ask</button>
                                <button type="button"
                                        class="plan-mode-pill"
                                        :class="{ 'plan-mode-pill-active': planMode === 'modify' }"
                                        @click="planMode = 'modify'"
                                        role="tab"
                                        :aria-selected="planMode === 'modify'"
                                        title="Request a change to the plan">Modify</button>
                            </div>
                            <form class="plan-chat-input-row" @submit.prevent="sendChatMessage()">
                                <input type="text"
                                       class="plan-chat-input"
                                       :placeholder="planMode === 'modify' ? 'Describe a change\u2026' : 'Ask about the plan\u2026'"
                                       x-model="chatInput"
                                       x-ref="chatInput"
                                       :disabled="chatInFlight || planPreview !== null"
                                       @keydown.enter.prevent="sendChatMessage()">
                                <button type="submit"
                                        class="btn btn-sm btn-primary"
                                        :disabled="chatInFlight || !chatInput.trim() || planPreview !== null"
                                        x-text="chatInFlight ? (planMode === 'modify' ? 'Thinking\u2026' : 'Asking\u2026') : (planMode === 'modify' ? 'Request Change' : 'Ask Agent')"></button>
                            </form>
                        </div>
                        <template x-if="!planPending && selectedWorkflowStep !== null">
                            <div class="ws-filter-hint" @click="selectedWorkflowStep = null" style="cursor: pointer;">
                                Showing actions for step <span x-text="selectedWorkflowStep"></span>. Click to show all.
                            </div>
                        </template>
                    </div>
                </template>

                <div class="follow-indicator"
                     :class="{ following: autoFollow && selectedStep === null }">
                    <button type="button"
                            class="plan-mode-pill"
                            :class="{ 'plan-mode-pill-active': autoFollow }"
                            @click="autoFollow = !autoFollow"
                            role="switch"
                            :aria-checked="autoFollow"
                            aria-label="Auto-follow latest step"
                            title="Toggle auto-follow">Auto-follow</button>
                    <template x-if="autoFollow && selectedStep === null">
                        <span>Following latest</span>
                    </template>
                    <template x-if="!autoFollow && selectedStep === null">
                        <span>Paused</span>
                    </template>
                    <template x-if="selectedStep !== null">
                        <span x-text="'Viewing step #' + (activeStep ? activeStep.step : '')"></span>
                    </template>
                </div>

                <!-- Step log -->
                <div class="step-log" x-ref="stepLog">
                    <template x-if="filteredSteps.length === 0 && !taskRunning">
                        <p class="muted">No steps yet. Start a task above.</p>
                    </template>
                    <template x-for="(row, idx) in groupedSteps" :key="idx + '-' + _stepKey(row.step)">
                        <div class="step-entry"
                             :class="[
                                 'step-' + row.step.execute_status,
                                 selectedStep === row.groupKey ? 'selected' : '',
                                 row.groupSize > 1 ? 'step-in-group' : '',
                                 row.groupSize > 1 && row.isGroupHead ? 'step-group-head' : '',
                                 row.groupSize > 1 && !row.isGroupHead ? 'step-group-member' : ''
                             ]"
                             @click="selectStepGroup(row.groupKey, row.step)">
                            <template x-if="row.isGroupHead || row.groupSize === 1">
                                <span class="step-num" x-text="'#' + row.step.step"></span>
                            </template>
                            <template x-if="!row.isGroupHead && row.groupSize > 1">
                                <span class="step-num step-group-indent">&rdsh;</span>
                            </template>
                            <span class="step-action" x-text="formatStep(row.step)"></span>
                            <span class="step-latency" x-show="row.step.llm_latency_ms > 0" x-text="row.step.llm_latency_ms + 'ms'"></span>
                            <span class="step-tokens muted" x-show="row.step.input_tokens > 0 || row.step.output_tokens > 0"
                                  x-text="row.step.input_tokens + ' in · ' + row.step.output_tokens + ' out' + (row.step.cache_read_tokens ? ' · ' + row.step.cache_read_tokens + ' cr' : '') + (row.step.cache_creation_tokens ? ' · ' + row.step.cache_creation_tokens + ' cw' : '')"></span>
                            <span class="step-status" x-text="'[' + row.step.execute_status + ']'"></span>
                        </div>
                    </template>
                </div>
            </div><!-- .step-split-right -->

        </div><!-- .step-split -->

        <!-- Task result -->
        <template x-if="taskResult && taskResult.status !== 'completed'">
            <div class="task-result" :class="'result-' + taskResult.status">
                <strong x-text="taskResult.status.toUpperCase()"></strong>:
                <span x-text="taskResult.reason"></span>
                <div class="result-stats">
                    <span x-text="taskResult.total_steps + ' steps'"></span> &middot;
                    <span x-text="taskResult.total_duration_s + 's'"></span> &middot;
                    <span x-text="taskResult.total_input_tokens + ' in + ' + taskResult.total_output_tokens + ' out'"></span>
                    <template x-if="taskResult.total_cache_read_tokens || taskResult.total_cache_creation_tokens">
                        <span>
                            &middot; <span x-text="(taskResult.total_cache_read_tokens || 0) + ' cache read'"></span>
                            &middot; <span x-text="(taskResult.total_cache_creation_tokens || 0) + ' cache write'"></span>
                        </span>
                    </template>
                </div>
            </div>
        </template>
    </section>

    <!-- ============================================================ -->
    <!-- Config Panel                                                  -->
    <!-- ============================================================ -->
    <section x-show="tab === 'config'" class="panel">
        <template x-if="config">
            <div class="config-grid">

                <!-- LLM -->
                <fieldset>
                    <legend>LLM (M3)</legend>
                    <label>Provider
                        <select x-model="config.llm.provider" @change="saveSection('llm')">
                            <option value="anthropic">Anthropic</option>
                            <option value="openai">OpenAI</option>
                        </select>
                    </label>
                    <label>Model
                        <input type="text" list="llm-model-options"
                               x-model="config.llm.model">
                        <datalist id="llm-model-options">
                            <template x-for="m in currentModelOptions()" :key="m">
                                <option :value="m"></option>
                            </template>
                        </datalist>
                    </label>
                    <label>API Key
                        <input type="password" x-model="config.llm.api_key"
                               placeholder="sk-...">
                    </label>
                    <label>Base URL
                        <input type="text" x-model="config.llm.base_url"
                               placeholder="(default)">
                    </label>
                    <label>Temperature
                        <input type="number" x-model.number="config.llm.temperature"
                               step="0.1" min="0" max="2">
                    </label>
                    <button @click="saveSection('llm')" class="btn">Save LLM</button>
                </fieldset>

                <!-- Agent -->
                <fieldset>
                    <legend>Agent (M2)</legend>
                    <label>Max Steps
                        <input type="number" x-model.number="config.agent.max_steps" min="1">
                    </label>
                    <label>Timeout (s)
                        <input type="number" x-model.number="config.agent.task_timeout_s" min="1">
                    </label>
                    <label>Post-action Delay (s)
                        <input type="number" x-model.number="config.agent.post_action_delay_s"
                               step="0.1" min="0">
                    </label>
                    <button @click="saveSection('agent')" class="btn">Save Agent</button>
                </fieldset>

                <!-- Network -->
                <fieldset>
                    <legend>Network</legend>
                    <label>Web Host
                        <input type="text" x-model="config.network.web_host">
                    </label>
                    <label>Web Port
                        <input type="number" x-model.number="config.network.web_port">
                    </label>
                    <button @click="saveSection('network')" class="btn">Save Network</button>
                </fieldset>

            </div>
        </template>
        <template x-if="!config">
            <p class="muted">Loading configuration...</p>
        </template>
    </section>

    <!-- ============================================================ -->
    <!-- Skills Panel                                                  -->
    <!-- ============================================================ -->
    <section x-show="tab === 'skills'" class="panel">

        <!-- 1. Active Skills summary -->
        <div class="connection-panel">
            <div class="connection-row">
                <div class="connection-item">
                    <span class="connection-label-fixed">Active Skills:</span>
                    <span x-show="activeSkills.length === 0" style="font-size:0.8rem; color:var(--text-muted);">none</span>
                    <span x-show="activeSkills.length > 0" style="display:flex;align-items:center;gap:0.4rem;">
                        <span class="status-dot dot-ok"></span>
                        <span style="font-size:0.8rem; color:var(--ok);" x-text="activeSkills.join(', ')"></span>
                    </span>
                </div>
            </div>
        </div>

        <!-- 2. Section header + "New Skill" button -->
        <div class="section-header">
            <span class="section-title">Available Skills</span>
            <button class="btn btn-sm btn-primary" style="font-size:0.75rem;"
                    :disabled="editingSkill"
                    @click="startNewSkill()">+ New Skill</button>
        </div>

        <!-- 3. Skill list -->
        <div class="skill-list">
            <template x-if="skills.length === 0">
                <p class="muted">No skills found.</p>
            </template>
            <template x-for="s in skills" :key="s.name">
                <div class="skill-entry"
                     :class="[selectedSkill === s.name ? 'selected' : '', activeSkills.includes(s.name) ? 'active-skill' : '']"
                     @click="selectSkill(s.name)">
                    <input type="checkbox" class="skill-checkbox"
                           :checked="activeSkills.includes(s.name)"
                           @click.stop="toggleSkill(s.name)">
                    <span class="skill-name" x-text="s.name"></span>
                    <template x-if="activeSkills.includes(s.name)">
                        <span class="skill-active-badge">active</span>
                    </template>
                    <span class="skill-source" :class="s.source" x-text="s.source"></span>
                </div>
            </template>
        </div>

        <!-- 4. Preview panel (shown when a skill is selected and not editing) -->
        <template x-if="selectedSkill && !editingSkill">
            <div class="skill-preview">
                <div class="skill-preview-header">
                    <div style="display:flex;align-items:center;gap:0.5rem;">
                        <strong x-text="selectedSkill"></strong>
                        <span class="skill-source" :class="skillSource" x-text="skillSource"></span>
                    </div>
                    <div class="skill-preview-actions">
                        <button class="btn btn-sm" @click="copyText(skillContent, $event)">Copy</button>
                        <button class="btn btn-sm" @click="startEditSkill()">Edit</button>
                        <button class="btn btn-sm btn-danger"
                                :disabled="skillSource === 'bundled'"
                                @click="deleteSkill(selectedSkill)">Delete</button>
                    </div>
                </div>
                <pre class="skill-preview-content" x-text="skillContent"></pre>
            </div>
        </template>

        <!-- 5. Editor panel (shown when creating or editing) -->
        <template x-if="editingSkill">
            <div class="skill-editor">
                <div class="skill-editor-header">
                    <div style="display:flex;gap:0.5rem;align-items:center;">
                        <strong x-text="isNewSkill ? 'New Skill' : 'Editing:'"></strong>
                        <input class="skill-name-input" placeholder="skill-name"
                               x-model="editSkillName"
                               :disabled="!isNewSkill">
                    </div>
                    <div style="display:flex;gap:0.35rem;">
                        <button class="btn btn-sm btn-primary" @click="saveSkill()"
                                :disabled="!editSkillName.trim() || !editSkillContent.trim()">Save</button>
                        <button class="btn btn-sm" @click="cancelEdit()">Cancel</button>
                    </div>
                </div>
                <textarea class="skill-textarea" x-model="editSkillContent"
                          placeholder="# My Skill&#10;&#10;Describe the application's UI layout, keyboard shortcuts, and workflows here..."></textarea>
            </div>
        </template>

    </section>

    <!-- ============================================================ -->
    <!-- Status Panel                                                  -->
    <!-- ============================================================ -->
    <section x-show="tab === 'status'" class="panel"
             x-effect="tab === 'status' ? startSetupPolling() : stopSetupPolling()">
        <div class="status-grid">
            <div class="status-card">
                <h3>Modules</h3>
                <p :class="modulesReady ? 'text-ok' : 'text-warn'"
                   x-text="modulesReady ? 'Initialised' : 'Not initialised'"></p>
            </div>
            <div class="status-card">
                <h3>Capture</h3>
                <p x-text="statusData.capture_source || '-'"></p>
            </div>
            <div class="status-card">
                <h3>Transport</h3>
                <p x-text="statusData.executor_transport || '-'"></p>
            </div>
            <div class="status-card">
                <h3>LLM</h3>
                <p x-text="(statusData.llm_provider || '-') + ' / ' + (statusData.llm_model || '-')"></p>
            </div>
            <div class="status-card">
                <h3>Task</h3>
                <p x-text="statusData.task ? statusData.task.status : 'idle'"></p>
            </div>
            <div class="status-card">
                <h3>Wi-Fi</h3>
                <template x-if="statusData.wifi && statusData.wifi.connected">
                    <p x-text="statusData.wifi.ssid + ' (' + statusData.wifi.ip + ')'"></p>
                </template>
                <template x-if="!statusData.wifi || !statusData.wifi.connected">
                    <p class="text-warn">Not connected</p>
                </template>
            </div>
        </div>
        <div style="margin-top:1rem; display:flex; gap:0.5rem;">
            <button @click="refreshStatus(); refreshSetupStatus()" class="btn">Refresh</button>
        </div>

        <!-- ============================================================ -->
        <!-- Hardware Setup Status                                         -->
        <!-- ============================================================ -->
        <div class="setup-section">
            <h2>Hardware Setup</h2>
            <p class="muted setup-help">
                Commands are run in the terminal (SSH into the Pi).
                This view refreshes every 10 seconds.
            </p>

            <template x-if="!setupStatus">
                <p class="muted">Loading…</p>
            </template>

            <template x-if="setupStatus">
                <div>
                    <!-- Top-level "run everything" hint -->
                    <template x-if="setupStatus.setup_commands && setupStatus.setup_commands.length > 0">
                        <div class="setup-action">
                            <p class="setup-action-label">Run in terminal to set up everything:</p>
                            <template x-for="cmd in setupStatus.setup_commands" :key="cmd">
                                <code class="setup-cmd" x-text="cmd"></code>
                            </template>
                        </div>
                    </template>

                    <!-- Per-component checklist -->
                    <ul class="setup-checklist">
                        <template x-for="key in Object.keys(setupStatus.components)" :key="key">
                            <li class="setup-item">
                                <span class="setup-badge"
                                      :class="setupStatusBadge(setupStatus.components[key].status).cls"
                                      x-text="setupStatusBadge(setupStatus.components[key].status).icon"></span>
                                <div class="setup-item-body">
                                    <div class="setup-item-header">
                                        <strong x-text="setupComponentLabel(key)"></strong>
                                        <span class="setup-status"
                                              :class="setupStatusBadge(setupStatus.components[key].status).cls"
                                              x-text="setupStatus.components[key].status.replace(/_/g, ' ')"></span>
                                    </div>
                                    <p class="setup-detail" x-text="setupStatus.components[key].detail"></p>
                                    <!-- Component-specific fix command for non-ready states -->
                                    <template x-if="['not_configured', 'partial'].includes(setupStatus.components[key].status) && setupComponentCommand(key)">
                                        <code class="setup-cmd-inline" x-text="setupComponentCommand(key)"></code>
                                    </template>
                                    <template x-if="setupStatus.components[key].status === 'reboot_required'">
                                        <code class="setup-cmd-inline">sudo reboot</code>
                                    </template>
                                </div>
                            </li>
                        </template>
                    </ul>
                </div>
            </template>
        </div>
    </section>

    <!-- ============================================================ -->
    <!-- Debug Panel                                                   -->
    <!-- ============================================================ -->
    <section x-show="tab === 'debug'" class="panel">
        <div class="debug-filters">
            <label>Level
                <select x-model="logFilter.level">
                    <option value="">All</option>
                    <option value="DEBUG">DEBUG</option>
                    <option value="INFO">INFO</option>
                    <option value="WARNING">WARNING</option>
                    <option value="ERROR">ERROR</option>
                </select>
            </label>
            <label>Module
                <select x-model="logFilter.module">
                    <option value="">All</option>
                    <option value="M1">M1 Capture</option>
                    <option value="M2">M2 Agent</option>
                    <option value="M3">M3 LLM</option>
                    <option value="M4">M4 Executor</option>
                    <option value="M5">M5 UI</option>
                </select>
            </label>
            <label class="checkbox-label">
                <input type="checkbox" x-model="logFilter.autoScroll"> Auto-scroll
            </label>
            <button @click="loadLogs()" class="btn btn-sm">Refresh</button>
            <button @click="clearLogs()" class="btn btn-sm btn-danger">Clear</button>
        </div>

        <div class="log-output" x-ref="logContainer">
            <template x-if="filteredLogs.length === 0">
                <p class="muted">(no logs)</p>
            </template>
            <template x-for="(log, idx) in filteredLogs" :key="idx">
                <div class="log-entry" :class="'log-' + (log.level || '').toLowerCase()">
                    <span x-text="log"></span>
                </div>
            </template>
        </div>
    </section>

    <!-- WS status (minimal, bottom-right) -->
    <footer class="footer" x-show="!wsConnected">
        <span>WS: <span class="text-warn">disconnected</span></span>
    </footer>

</div>

</body>
</html>
