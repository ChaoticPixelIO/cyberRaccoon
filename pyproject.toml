[build-system]
requires = ["setuptools >= 67.6"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberraccoon"
version = "1.0.0"
description = "AI computer control via HDMI capture + USB HID"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "ChaoticPixelIO"}]

# NOTE: opencv-python intentionally excluded -- on Raspberry Pi, the venv
# inherits the system python3-opencv (4.10.0 with GStreamer). pip-installing
# opencv-python shadows the system package and loses GStreamer support,
# which breaks AirPlay capture.
dependencies = [
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "anthropic>=0.45.0",
    "openai>=1.66.0",
    "pyyaml>=6.0",
    "prompt_toolkit>=3.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.34.0",
    "websockets>=13.0,<14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[project.scripts]
cyberraccoon = "cyberraccoon.__main__:main"

[tool.setuptools.package-data]
cyberraccoon = [
    "executor/sdp_record.xml",
    "ui/web/static/*.html",
    "ui/web/static/*.js",
    "ui/web/static/*.css",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
